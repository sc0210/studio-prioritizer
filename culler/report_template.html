<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culling report</title>
<style>
:root {
  --bg: #f5f5f3; --panel: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --line: #e2e2dd;
  --chip: #ececea; --chip-on: #1c1c1a; --chip-on-fg: #ffffff;
  --pick: #2e8b57; --duplicate: #c9a227; --reject: #c0392b; --note: #b4632a;
  --thumb: 220px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1f1f1d; --fg: #ececea; --muted: #9a9a94; --line: #2e2e2b;
    --chip: #2a2a27; --chip-on: #ececea; --chip-on-fg: #141413; --note: #e09a5f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.bar h1 { font-size: 17px; margin: 0; font-weight: 650; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.chip .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
select, input[type=search] { background: var(--chip); border: 0; border-radius: 8px; padding: 5px 8px; }
input[type=search] { width: 170px; }
input[type=range] { width: 110px; accent-color: var(--fg); }
.status { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

main { padding: 16px; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(min(var(--thumb), 100%), 1fr)); }
.empty { padding: 60px 16px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
figure { margin: 0; background: var(--panel); border-radius: 8px; overflow: hidden; cursor: zoom-in;
  border-top: 4px solid var(--pick); display: flex; flex-direction: column; }
figure.duplicate { border-top-color: var(--duplicate); }
figure.reject { border-top-color: var(--reject); }
figure.reject img { opacity: .6; }
figure:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
figure img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: #0002; }
figcaption { padding: 8px 10px 10px; display: grid; gap: 3px; }
.row { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type { font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.stars { letter-spacing: 1px; }
.score { color: var(--muted); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.tag.fix { color: var(--note); }
.tag.bad { color: var(--reject); }

dialog { border: 0; padding: 0; width: min(1400px, 96vw); height: min(900px, 92vh); background: var(--panel); color: var(--fg);
  border-radius: 12px; overflow: hidden; }
dialog::backdrop { background: #000c; }
.viewer { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
.stage { background: #0a0a0a; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: #0008; color: #fff;
  width: 40px; height: 64px; font-size: 26px; cursor: pointer; border-radius: 6px; }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.info { padding: 16px; overflow: auto; border-left: 1px solid var(--line); }
.info h2 { font-size: 16px; margin: 0 28px 4px 0; word-break: break-all; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 14px 0 0; }
.info dt { color: var(--muted); }
.info dd { margin: 0; overflow-wrap: anywhere; }
.close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (max-width: 760px) {
  .viewer { grid-template-columns: 1fr; grid-template-rows: 60% 40%; }
  .info { border-left: 0; border-top: 1px solid var(--line); }
  .status { margin-left: 0; }
  .bar { position: static; }
}
</style>
</head>
<body>
<div class="bar">
  <h1>Culling report</h1>
  <div class="group" id="decisions"><span class="label">Show</span></div>
  <div class="group" id="types"><span class="label">File</span></div>
  <div class="group">
    <span class="label">Rating</span>
    <select id="stars" aria-label="Minimum stars">
      <option value="0">Any</option><option value="2">★★ and up</option><option value="3">★★★ and up</option>
      <option value="4">★★★★ and up</option><option value="5">★★★★★</option>
    </select>
  </div>
  <div class="group">
    <span class="label">Note</span>
    <select id="note" aria-label="Filter by note">
      <option value="">Any</option>
      <option value="none">No notes</option>
      <option value="exposure">Needs exposure fix</option>
      <option value="eyes closed?">Possible blink</option>
      <option value="blurry">Blurry</option>
      <option value="empty frame">Empty frame</option>
    </select>
  </div>
  <div class="group">
    <span class="label">Sort</span>
    <select id="sort" aria-label="Sort order">
      <option value="time">Time (bursts together)</option>
      <option value="score">Best first</option>
      <option value="name">File name</option>
    </select>
  </div>
  <input type="search" id="search" placeholder="Search file name" aria-label="Search file name">
  <div class="group"><span class="label">Size</span><input type="range" id="size" min="140" max="420" step="20" aria-label="Thumbnail size"></div>
  <span class="status" id="status"></span>
</div>
<main id="grid"></main>

<dialog id="viewer">
  <div class="viewer">
    <div class="stage">
      <img id="big" alt="">
      <button class="nav prev" id="prev" aria-label="Previous photo">‹</button>
      <button class="nav next" id="next" aria-label="Next photo">›</button>
    </div>
    <div class="info" id="info"></div>
  </div>
  <button class="close" id="close" aria-label="Close">✕</button>
</dialog>

<script>
const PHOTOS = /*DATA*/[];

const DECISIONS = [
  ["pick", "Picks", "var(--pick)"],
  ["duplicate", "Similar", "var(--duplicate)"],
  ["reject", "Rejects", "var(--reject)"],
];
const EXPOSURE = ["overexposed", "underexposed"];
const REJECTING = ["blurry", "empty frame"];

const defaults = { decisions: ["pick", "duplicate"], types: [], stars: 0, note: "", sort: "time", search: "", size: 220 };
const state = { ...defaults, ...load() };
let visible = [];
let current = -1;

function load() {
  try { return JSON.parse(localStorage.getItem("culling-report") || "{}"); } catch { return {}; }
}
function save() {
  try { localStorage.setItem("culling-report", JSON.stringify(state)); } catch {}
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const count = (fn) => PHOTOS.filter(fn).length;
const burstSize = {};
PHOTOS.forEach((p) => (burstSize[p.burst] = (burstSize[p.burst] || 0) + 1));

function chip(group, key, text, n, dot) {
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = (dot ? `<span class="dot" style="background:${dot}"></span>` : "") + `${esc(text)}<span class="n">${n}</span>`;
  b.setAttribute("aria-pressed", state[group].includes(key));
  b.onclick = () => {
    const on = state[group].includes(key);
    state[group] = on ? state[group].filter((k) => k !== key) : [...state[group], key];
    b.setAttribute("aria-pressed", !on);
    render();
  };
  return b;
}

function buildControls() {
  for (const [key, text, color] of DECISIONS) $("decisions").append(chip("decisions", key, text, count((p) => p.decision === key), color));
  const types = [...new Set(PHOTOS.map((p) => p.type))].sort();
  // With only one file type there's nothing to filter.
  if (types.length > 1) for (const t of types) $("types").append(chip("types", t, t, count((p) => p.type === t)));
  else $("types").remove();
  for (const id of ["stars", "note", "sort", "search", "size"]) {
    const el = $(id);
    el.value = state[id];
    el.addEventListener("input", () => {
      state[id] = el.type === "range" || id === "stars" ? Number(el.value) : el.value;
      id === "size" ? applySize() : render();
    });
  }
  applySize();
}

function applySize() {
  document.documentElement.style.setProperty("--thumb", state.size + "px");
  save();
}

function matches(p) {
  if (!state.decisions.includes(p.decision)) return false;
  if (state.types.length && !state.types.includes(p.type)) return false;
  if (p.stars < state.stars) return false;
  if (state.note === "none" && p.reasons.some((r) => r !== "similar to a better shot")) return false;
  if (state.note === "exposure" && !p.reasons.some((r) => EXPOSURE.includes(r))) return false;
  if (state.note && !["none", "exposure"].includes(state.note) && !p.reasons.includes(state.note)) return false;
  if (state.search && !p.file.toLowerCase().includes(state.search.toLowerCase())) return false;
  return true;
}

const sorters = {
  time: (a, b) => (a.captured_at || "~").localeCompare(b.captured_at || "~") || a.burst - b.burst || b.score - a.score,
  score: (a, b) => b.stars - a.stars || b.score - a.score,
  name: (a, b) => a.name.localeCompare(b.name),
};

function settings(p) {
  return [p.shutter && p.shutter + "s", p.aperture && "f/" + p.aperture, p.iso && "ISO " + p.iso, p.focal_length && p.focal_length + "mm"]
    .filter(Boolean).join(" · ");
}

function tags(p) {
  return p.reasons.map((r) => {
    const cls = REJECTING.includes(r) ? "bad" : EXPOSURE.includes(r) ? "fix" : "";
    const text = EXPOSURE.includes(r) ? r + " (fixable)" : r;
    return `<span class="tag ${cls}">${esc(text)}</span>`;
  }).join("");
}

function card(p, i) {
  const burst = burstSize[p.burst] > 1 ? `<span class="tag">burst of ${burstSize[p.burst]}</span>` : "";
  return `<figure class="${p.decision}" tabindex="0" data-i="${i}">
    <img loading="lazy" src="${esc(p.thumb)}" alt="">
    <figcaption>
      <div class="row"><span class="name" title="${esc(p.file)}">${esc(p.name)}</span><span class="type">${esc(p.type)}</span></div>
      <div class="row"><span class="stars">${"★".repeat(p.stars)}${"☆".repeat(5 - p.stars)}</span><span class="score">${Math.round(p.score)}</span></div>
      <div class="meta">${esc(settings(p) || "—")}</div>
      <div class="tags">${burst}${tags(p)}</div>
    </figcaption></figure>`;
}

function render() {
  save();
  visible = PHOTOS.filter(matches).sort(sorters[state.sort]);
  $("grid").innerHTML = visible.length
    ? visible.map(card).join("")
    : `<p class="empty">No photos match these filters.</p>`;
  $("status").textContent = `Showing ${visible.length} of ${PHOTOS.length}`;
}

function open(i) {
  current = (i + visible.length) % visible.length;
  const p = visible[current];
  $("big").src = p.preview;
  const label = { pick: "Pick", duplicate: "Similar to a better shot", reject: "Reject" }[p.decision];
  const when = p.captured_at ? new Date(p.captured_at).toLocaleString() : "—";
  const gps = p.gps ? `<a href="https://maps.google.com/?q=${p.gps[0]},${p.gps[1]}" target="_blank" rel="noopener">${p.gps[0]}, ${p.gps[1]}</a>` : "—";
  const rows = [
    ["Decision", label], ["Rating", "★".repeat(p.stars) + "☆".repeat(5 - p.stars) + " · " + Math.round(p.score)],
    ["Taken", esc(when)], ["Camera", esc(p.camera || "—")], ["Lens", esc(p.lens || "—")],
    ["Settings", esc(settings(p) || "—")], ["Location", gps],
    ["Focus", p.sharpness], ["Brightness", Math.round(p.brightness) + " / 255"],
    ["Faces", p.faces ? `${p.faces}${p.faces_eyes_closed ? ` (${p.faces_eyes_closed} possible blink)` : ""}` : "none"],
    ["Burst", burstSize[p.burst] > 1 ? `${burstSize[p.burst]} frames` : "single"],
  ];
  $("info").innerHTML = `<h2>${esc(p.name)}</h2><div class="tags">${tags(p)}</div>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <p class="hint">${esc(p.file)}<br>← → to step through · Esc to close</p>`;
  if (!$("viewer").open) $("viewer").showModal();
}

$("grid").addEventListener("click", (e) => {
  const f = e.target.closest("figure");
  if (f) open(Number(f.dataset.i));
});
$("grid").addEventListener("keydown", (e) => {
  const f = e.target.closest("figure");
  if (f && e.key === "Enter") open(Number(f.dataset.i));
});
$("prev").onclick = () => open(current - 1);
$("next").onclick = () => open(current + 1);
$("close").onclick = () => $("viewer").close();
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });
document.addEventListener("keydown", (e) => {
  if (!$("viewer").open) return;
  if (e.key === "ArrowLeft") open(current - 1);
  if (e.key === "ArrowRight") open(current + 1);
});

buildControls();
render();
</script>
</body>
</html>
